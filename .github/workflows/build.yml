name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (no codesign)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project NinebotCast.xcodeproj \
            -scheme NinebotCast \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/NinebotCast.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            | tail -n 60

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R "build/NinebotCast.xcarchive/Products/Applications/NinebotCast.app" build/Payload/
          cd build
          zip -qry NinebotCast-0.8.0-unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NinebotCast-0.8.0-unsigned-ipa
          path: build/NinebotCast-0.8.0-unsigned.ipa

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/NinebotCast-0.8.0-unsigned.ipa
